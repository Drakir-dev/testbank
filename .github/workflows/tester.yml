# Kjører de automatiske testene (node --test) på hver pull request mot main
# og hver gang noe pushes til main. Resultatet vises som en grønn hake eller
# et rødt kryss i pull requesten.
name: Tester

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tester:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test
